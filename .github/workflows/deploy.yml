name: Deploy
 
# Auto-deploy the Worker to Cloudflare on every push to main, plus a manual
# trigger. This replicates the project's real deploy flow exactly:
# `bun run deploy` = preflight.mjs -> `flue build --target cloudflare` ->
# `wrangler deploy`. It deliberately does NOT use a bare wrangler action, which
# would skip the flue build and the merged-config redirect that
# `wrangler deploy` relies on.
 
on:
  push:
    branches: [main]
  workflow_dispatch: {}
 
# One deploy at a time. Newer pushes wait for the in-flight deploy rather than
# racing it; we don't cancel mid-deploy because that could interrupt a
# wrangler upload.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
 
      - name: Install dependencies
        run: bun install --frozen-lockfile
 
      # `bun run deploy` runs scripts/preflight.mjs (asserts wrangler.jsonc has
      # the ai binding, AI_GATEWAY_ID var, and the [FlueRegistry, Chat]
      # migration), then `flue build --target cloudflare`, then `wrangler deploy`
      # against the merged dist config. The GITHUB_TOKEN worker secret set via
      # `wrangler secret put` is managed out-of-band and is preserved across
      # deploys — wrangler inherits all unchanged secrets from the previous
      # Worker version, so this redeploy does not touch it.
      - name: Build and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
